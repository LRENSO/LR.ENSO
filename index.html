<!DOCTYPE html>
<html lang="lv">
<head>
  <meta charset="UTF-8">
  <title>LR.ENSO</title>

  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Poppins', sans-serif;
      background-color: #d8cfc0; /* Warm sand background */
      color: #3a3a3a;
    }

    /* HEADER / LOGO */
    header {
      background-color: #0f5c66; /* Deep Teal */
      padding: 28px;
      text-align: center;
      border-bottom: 3px solid #93c0bb; /* Mint accent */
    }

    header h1 {
      margin: 0;
      font-size: 38px;
      color: #93c0bb; /* Mint logo text */
      letter-spacing: 2px;
      font-weight: 600;
    }

    /* HERO SECTION */
    .hero {
      text-align: center;
      padding: 55px 20px;
      background-color: #93c0bb; /* Mint */
      border-bottom: 3px solid #ea9883; /* Coral accent */
    }

    .hero h2 {
      font-size: 30px;
      color: #0f5c66; /* Deep Teal */
      margin-bottom: 12px;
    }

    .hero p {
      font-size: 18px;
      color: #ffffff;
    }

    /* PRODUCT GRID */
    .products {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 30px;
      padding: 50px 20px;
    }

    .item {
      background-color: #ffffff;
      width: 260px;
      padding: 22px;
      border-radius: 18px;
      box-shadow: 0px 4px 12px rgba(0,0,0,0.08);
      text-align: center;
      transition: transform 0.2s ease;
      border: 2px solid #93c0bb; /* Mint border */
    }

    .item:hover {
      transform: scale(1.03);
    }

    .item img {
      width: 100%;
      border-radius: 14px;
      margin-bottom: 15px;
    }

    .item h3 {
      font-size: 18px;
      color: #0f5c66; /* Deep Teal */
      margin-bottom: 8px;
    }

    .item p {
      font-size: 16px;
      color: #ea9883; /* Coral accent */
      font-weight: bold;
    }
  </style>
</head>

<body>

<header>
  <h1>LR.ENSO</h1>
</header>

<section class="hero">
  <h2>Ocean Pastels Boutique</h2>
  <p>Deep Teal • Mint • Coral Peach • Warm Sand</p>
</section>

<section class="products">
  <div class="item">
    <img src="https://via.placeholder.com/260x260/93c0bb/ffffff?text=Mint" alt="">
    <h3>Mint komplekts</h3>
    <p>19,90 €</p>
  </div>

  <div class="item">
    <img src="https://via.placeholder.com/260x260/ea9883/ffffff?text=Coral" alt="">
    <h3>Coral Peach cepurīte</h3>
    <p>12,50 €</p>
  </div>

  <div class="item">
    <img src="https://via.placeholder.com/260x260/0f5c66/ffffff?text=Teal" alt="">
    <h3>Deep Teal džemperis</h3>
    <p>24,90 €</p>
  </div>
</section>

</body>
</html>
