<!DOCTYPE html>
<html lang="lv">
<head>
  <meta charset="UTF-8">
  <title>LR.ENSO</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Poppins', sans-serif;
      background-color: #fdfdfd; /* Pearl White */
      color: #4a4a4a;
    }

    header {
      background-color: #ffe2d9; /* Coral Peach (soft) */
      padding: 22px;
      text-align: center;
      border-bottom: 2px solid #ffd0c4;
    }

    header h1 {
      margin: 0;
      font-size: 34px;
      color: #ff9e85; /* Coral Peach */
      letter-spacing: 1px;
    }

    .hero {
      text-align: center;
      padding: 45px 20px;
      background-color: #e8fdfc; /* Seafoam Green */
    }

    .hero h2 {
      font-size: 30px;
      color: #007b7f; /* Deep Teal */
      margin-bottom: 12px;
    }

    .hero p {
      font-size: 18px;
      color: #4a6f6f; /* muted teal */
    }

    .products {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 28px;
      padding: 45px 20px;
    }

    .item {
      background-color: #ffffff;
      width: 260px;
      padding: 22px;
      border-radius: 18px;
      box-shadow: 0px 4px 12px rgba(0,0,0,0.08);
      text-align: center;
      transition: transform 0.2s ease;
      border: 2px solid #e0f7f9; /* Aqua Blue border */
    }

    .item:hover {
      transform: scale(1.03);
    }

    .item img {
      width: 100%;
      border-radius: 14px;
      margin-bottom: 15px;
    }

    .item h3 {
      font-size: 18px;
      color: #005f63; /* Deep Teal */
      margin-bottom: 8px;
    }

    .item p {
      font-size: 16px;
      color: #ff9e85; /* Coral Peach */
      font-weight: bold;
    }
  </style>
</head>

<body>

<header>
  <h1>LR.ENSO</h1>
</header>

<section class="hero">
  <h2>Ocean Pastels. Soft Boutique Style.</h2>
  <p>Deep Teal • Seafoam • Aqua • Pearl • Coral</p>
</section>

<section class="products">
  <div class="item">
    <img src="https://via.placeholder.com/260x260/e0f7f9/ffffff?text=Aqua+Blue" alt="">
    <h3>Aqua Blue komplekts</h3>
    <p>19,90 €</p>
  </div>

  <div class="item">
    <img src="https://via.placeholder.com/260x260/e8fdfc/ffffff?text=Seafoam" alt="">
    <h3>Seafoam cepurīte</h3>
    <p>12,50 €</p>
  </div>

  <div class="item">
    <img src="https://via.placeholder.com/260x260/ffe2d9/ffffff?text=Coral+Peach" alt="">
    <h3>Coral Peach džemperis</h3>
    <p>24,90 €</p>
  </div>
</section>

</body>
</html>
