<!DOCTYPE html>
<html lang="lv">
<head>
  <meta charset="UTF-8">
  <title>LR.ENSO</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Poppins', sans-serif;
      background-color: #fdf9f7;
      color: #5a5a5a;
    }

    header {
      background-color: #ffeef4;
      padding: 20px;
      text-align: center;
      border-bottom: 2px solid #ffd7e5;
    }

    header h1 {
      margin: 0;
      font-size: 32px;
      color: #ff9bbd;
      letter-spacing: 1px;
    }

    .hero {
      text-align: center;
      padding: 40px 20px;
      background-color: #fef6ff;
    }

    .hero h2 {
      font-size: 28px;
      color: #b48ad6;
      margin-bottom: 10px;
    }

    .hero p {
      font-size: 18px;
      color: #7a6f7f;
    }

    .products {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 25px;
      padding: 40px 20px;
    }

    .item {
      background-color: #ffffff;
      width: 260px;
      padding: 20px;
      border-radius: 18px;
      box-shadow: 0px 4px 12px rgba(0,0,0,0.08);
      text-align: center;
      transition: transform 0.2s ease;
    }

    .item:hover {
      transform: scale(1.03);
    }

    .item img {
      width: 100%;
      border-radius: 14px;
      margin-bottom: 15px;
    }

    .item h3 {
      font-size: 18px;
      color: #6b6b6b;
      margin-bottom: 8px;
    }

    .item p {
      font-size: 16px;
      color: #b48ad6;
      font-weight: bold;
    }
  </style>
</head>

<body>

<header>
  <h1>LR.ENSO</h1>
</header>

<section class="hero">
  <h2>Pastel vibes. Soft style. Cute aesthetic.</h2>
  <p>Maigi toņi, bērnu boutique noskaņa un tīrs dizains.</p>
</section>

<section class="products">
  <div class="item">
    <img src="https://via.placeholder.com/260x260/ffeef4/ffffff?text=Pastel+Item" alt="">
    <h3>Pastel komplekts</h3>
    <p>19,90 €</p>
  </div>

  <div class="item">
    <img src="https://via.placeholder.com/260x260/fef6ff/ffffff?text=Soft+Pink" alt="">
    <h3>Maiga cepurīte</h3>
    <p>12,50 €</p>
  </div>

  <div class="item">
    <img src="https://via.placeholder.com/260x260/fdf9f7/ffffff?text=Baby+Blue" alt="">
    <h3>Baby blue džemperis</h3>
    <p>24,90 €</p>
  </div>
</section>

</body>
</html>
